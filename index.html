<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Focus Reader" />
<link rel="manifest" href="./manifest.webmanifest" />
<title>Focus Reader</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  #readerFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;display:block}
  #boot{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#000;color:#f4f4f4;font-weight:750;letter-spacing:.01em;transition:opacity .18s ease}
  #boot.hide{opacity:0;pointer-events:none}
  #updateBanner{position:fixed;z-index:50;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);display:none;align-items:center;gap:10px;max-width:calc(100vw - 24px);padding:9px 10px 9px 13px;border:1px solid #444;border-radius:14px;background:rgba(16,16,16,.97);color:#f4f4f4;box-shadow:0 12px 32px rgba(0,0,0,.55);font-size:13px}
  #updateBanner.show{display:flex}
  #updateBanner button{border:0;border-radius:9px;padding:8px 11px;background:#f4f4f4;color:#111;font:inherit;font-weight:800}
  #updateBanner .dismiss{background:#242424;color:#ddd}
</style>
</head>
<body>
<iframe id="readerFrame" title="Focus Reader"></iframe>
<div id="boot">Loading Focus Reader…</div>
<div id="updateBanner"><span id="updateText">Update available</span><button id="applyUpdate">Update</button><button id="dismissUpdate" class="dismiss">Later</button></div>
<script>
(()=>{
  'use strict';
  const FALLBACK_VERSION='2026.10.15.1';
  const frame=document.getElementById('readerFrame');
  const bootEl=document.getElementById('boot');
  const banner=document.getElementById('updateBanner');
  const updateText=document.getElementById('updateText');
  const applyBtn=document.getElementById('applyUpdate');
  const dismissBtn=document.getElementById('dismissUpdate');
  let currentVersion=null;
  let pendingMeta=null;
  let lastCheck=0;

  async function fetchMeta(){
    const r=await fetch('./version.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('version '+r.status);
    return await r.json();
  }

  function versionedReaderUrl(v){
    return './reader.html?v='+encodeURIComponent(v||FALLBACK_VERSION);
  }

  function hideBanner(){ banner.classList.remove('show'); }

  function showBanner(meta){
    pendingMeta=meta;
    updateText.textContent='Focus Reader '+meta.version+' is ready';
    banner.classList.add('show');
  }

  function applyUpdate(meta=pendingMeta){
    if(!meta||!meta.version)return;
    hideBanner();
    currentVersion=String(meta.version);
    window.FOCUS_READER_VERSION=currentVersion;
    bootEl.textContent='Updating Focus Reader…';
    bootEl.classList.remove('hide');
    frame.src=versionedReaderUrl(currentVersion)+'&refresh='+Date.now();
  }

  async function checkForUpdate(manual=false){
    try{
      const meta=await fetchMeta();
      lastCheck=Date.now();
      if(!currentVersion){ currentVersion=String(meta.version||FALLBACK_VERSION); }
      if(String(meta.version||'')!==String(currentVersion||'')){
        if(manual){
          const ok=confirm('Focus Reader '+meta.version+' is available. Reload to update now?');
          if(ok)applyUpdate(meta); else showBanner(meta);
        }else showBanner(meta);
        return true;
      }
      if(manual) alert('Focus Reader is up to date ('+currentVersion+').');
      return false;
    }catch(err){
      if(manual) alert('Could not check for an update right now.');
      return false;
    }
  }

  function injectReaderUpdateUI(){
    try{
      const doc=frame.contentDocument;
      if(!doc)return;
      const toolbar=doc.querySelector('.toolbar');
      if(toolbar && !doc.getElementById('focusReaderUpdateGroup')){
        const group=doc.createElement('div');
        group.id='focusReaderUpdateGroup';
        group.className='group';
        group.style.gap='8px';
        group.innerHTML='<label>Build</label><span id="focusReaderBuildLabel" style="font-size:12px;color:#ddd;white-space:nowrap"></span>';
        const label=group.querySelector('#focusReaderBuildLabel');
        if(label)label.textContent=currentVersion||FALLBACK_VERSION;
        toolbar.appendChild(group);

        const check=doc.createElement('button');
        check.id='focusReaderCheckUpdate';
        check.textContent='Check for Update';
        check.title='Check GitHub Pages for a newer Focus Reader build';
        check.addEventListener('click',()=>checkForUpdate(true));
        toolbar.appendChild(check);
      }
    }catch(_){ }
  }

  frame.addEventListener('load',()=>{
    bootEl.classList.add('hide');
    setTimeout(injectReaderUpdateUI,50);
    setTimeout(injectReaderUpdateUI,500);
  });

  applyBtn.addEventListener('click',()=>applyUpdate());
  dismissBtn.addEventListener('click',hideBanner);

  window.focusReaderCheckForUpdate=()=>checkForUpdate(true);

  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden && Date.now()-lastCheck>15000) checkForUpdate(false);
  });
  window.addEventListener('focus',()=>{
    if(Date.now()-lastCheck>15000) checkForUpdate(false);
  });

  (async()=>{
    try{
      const meta=await fetchMeta();
      currentVersion=String(meta.version||FALLBACK_VERSION);
    }catch(_){
      currentVersion=FALLBACK_VERSION;
    }
    window.FOCUS_READER_VERSION=currentVersion;
    frame.src=versionedReaderUrl(currentVersion);
  })();
})();
</script>
</body>
</html>
