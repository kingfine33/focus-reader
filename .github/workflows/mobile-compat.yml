name: Apply mobile compatibility patch

on:
  push:
    paths:
      - '.github/workflows/mobile-compat.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Focus Reader
        run: python .github/scripts/mobile_patch.py
      - name: Commit tested mobile fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reader.html index.html version.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Harden Focus Reader mobile compatibility"
            git push
          fi
